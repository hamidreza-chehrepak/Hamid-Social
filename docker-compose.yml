services:
  postgres:
    image: postgres:16
    container_name: hamid-social-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: hamid_social
    ports:
      - "5434:5432"
    volumes:
      - hamid_social_data:/var/lib/postgresql/data

volumes:
  hamid_social_data: